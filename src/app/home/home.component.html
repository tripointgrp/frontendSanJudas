<div class="home-container">
  <h1>{{ title }}</h1>
  <p class="description">{{ description }}</p>

  <div class="modules-grid">
      <div *ngFor="let module of modules" class="module-card" (click)="navigateTo(module.route)">
          <span class="material-symbols-outlined module-icon">{{ module.icon }}</span>
          <h3>{{ module.name }}</h3>
      </div>
  </div>
</div>
